org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Production rule: never place Gemini API keys in the Android project.
# Set PRIVEAT_BACKEND_BASE_URL to your HTTPS backend proxy when cloud AI is ready.
PRIVEAT_BACKEND_BASE_URL=
PRIVEAT_CLOUD_AI_ENABLED=false
PRIVEAT_BACKEND_AUTH_ENABLED=false
GEMINI_FLASH_MODEL=gemini-3-flash-preview
GEMINI_PRO_MODEL=gemini-3.1-pro-preview
